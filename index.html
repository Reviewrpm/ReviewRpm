<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#17152f">
<title>ReviewRPM | Psychometrician</title>
<style>
:root{--bg:#f5f6fb;--panel:#fff;--ink:#20213a;--muted:#777b95;--brand:#635bdb;--brand2:#8b5cf6;--line:#e8e9f2;--good:#138a59;--bad:#d8445b;--shadow:0 12px 35px rgba(35,32,87,.08)}
*{box-sizing:border-box}body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{min-height:100vh}.topbar{height:72px;background:#17152f;color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 clamp(16px,4vw,54px);gap:16px}.logo{font-weight:850;font-size:1.25rem;letter-spacing:-.04em}.logo span{color:#a89cff}.top-actions{display:flex;gap:10px;align-items:center}.avatar{width:35px;height:35px;border-radius:12px;background:#7770e9;display:grid;place-items:center;font-weight:800}.layout{display:grid;grid-template-columns:230px 1fr;max-width:1500px;margin:auto;min-height:calc(100vh - 72px)}aside{padding:28px 16px;border-right:1px solid var(--line);background:#fbfbfe}.nav-label{font-size:.72rem;text-transform:uppercase;letter-spacing:.12em;color:#9a9db0;font-weight:800;padding:0 13px;margin:10px 0}.navbtn{width:100%;display:flex;align-items:center;gap:12px;border:0;background:transparent;color:#666a83;padding:12px 13px;border-radius:12px;text-align:left;margin:4px 0;font-weight:650}.navbtn.active,.navbtn:hover{background:#eeedff;color:var(--brand)}.navicon{width:22px;text-align:center}.side-note{margin:35px 5px 0;background:#efedff;border-radius:16px;padding:17px;font-size:.83rem;color:#56518f;line-height:1.5}.main{padding:clamp(20px,4vw,42px);min-width:0}.eyebrow{font-size:.75rem;color:var(--brand);text-transform:uppercase;letter-spacing:.13em;font-weight:850}.pagehead{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;margin-bottom:26px}.pagehead h1{margin:7px 0 8px;font-size:clamp(1.7rem,3vw,2.35rem);letter-spacing:-.045em}.sub{color:var(--muted);margin:0;line-height:1.5}.btn{border:0;border-radius:11px;padding:11px 16px;font-weight:750;transition:.15s}.btn-primary{background:var(--brand);color:white;box-shadow:0 7px 16px #635bdb30}.btn-primary:hover{background:#5148c6;transform:translateY(-1px)}.btn-light{background:#f0efff;color:var(--brand)}.btn-outline{background:#fff;border:1px solid var(--line);color:#555873}.btn-danger{background:#fff0f2;color:var(--bad)}.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:15px;margin-bottom:27px}.stat,.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow)}.stat{padding:20px}.stat-top{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:.85rem;font-weight:650}.stat-icon{width:37px;height:37px;border-radius:12px;display:grid;place-items:center;background:#efedff;font-size:1.1rem}.stat-num{font-size:1.8rem;font-weight:850;letter-spacing:-.04em;margin:12px 0 4px}.stat-foot{font-size:.78rem;color:var(--muted)}.section-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:25px 0 15px}.section-head h2{font-size:1.15rem;margin:0;letter-spacing:-.02em}.searchrow{display:flex;gap:10px;flex-wrap:wrap}.search{background:#fff;border:1px solid var(--line);padding:11px 14px;border-radius:11px;min-width:220px;outline:none}.search:focus,input:focus,select:focus,textarea:focus{border-color:#a49dfb;box-shadow:0 0 0 3px #635bdb18}.subject-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}.subject-card{padding:21px;cursor:pointer;transition:.18s}.subject-card:hover{transform:translateY(-3px);border-color:#c8c4ff}.subject-emoji{width:47px;height:47px;display:grid;place-items:center;border-radius:15px;background:#f0efff;font-size:1.45rem;margin-bottom:17px}.subject-card h3{margin:0 0 7px;font-size:1.05rem}.subject-card p{margin:0;color:var(--muted);font-size:.87rem;line-height:1.45}.subject-meta{display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--line);margin-top:18px;padding-top:15px;color:var(--muted);font-size:.8rem}.pill{display:inline-flex;align-items:center;gap:5px;border-radius:99px;padding:5px 9px;background:#f0efff;color:#5a52c8;font-size:.72rem;font-weight:800}.recent-list{display:grid;gap:10px}.recent-item{padding:15px 17px;display:flex;justify-content:space-between;align-items:center;gap:14px}.recent-left{display:flex;align-items:center;gap:12px}.recent-icon{width:42px;height:42px;display:grid;place-items:center;background:#f4f3ff;border-radius:13px}.recent-item strong{display:block;font-size:.92rem}.recent-item small{color:var(--muted);display:block;margin-top:4px}.empty{padding:35px;text-align:center;color:var(--muted)}.hidden{display:none!important}
.modalback{position:fixed;inset:0;background:#14132999;z-index:20;display:grid;place-items:center;padding:18px}.modal{background:white;border-radius:20px;padding:25px;width:min(560px,100%);max-height:90vh;overflow:auto;box-shadow:0 20px 80px #0003}.modal h2{margin:0 0 7px}.modal p{color:var(--muted);line-height:1.5}.formgrid{display:grid;gap:14px;margin:20px 0}.field{display:grid;gap:7px;font-size:.86rem;font-weight:750}.field input,.field select,.field textarea{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;outline:none}.field textarea{min-height:85px;resize:vertical}.modal-actions{display:flex;justify-content:flex-end;gap:9px;flex-wrap:wrap}.toast{position:fixed;right:20px;bottom:20px;background:#24223f;color:white;padding:13px 17px;border-radius:12px;box-shadow:var(--shadow);z-index:50;animation:up .2s ease}@keyframes up{from{transform:translateY(8px);opacity:0}to{transform:translateY(0);opacity:1}}
/* Test screen */
.test-shell{max-width:1050px;margin:0 auto}.testtop{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:20px}.testtop h1{font-size:1.4rem;margin:4px 0}.timer{background:#fff;border:1px solid var(--line);padding:10px 14px;border-radius:12px;font-weight:850;font-variant-numeric:tabular-nums}.timer.warning{color:var(--bad);background:#fff0f2}.testprogress{height:7px;background:#e8e7f6;border-radius:20px;overflow:hidden;margin-bottom:22px}.testprogress div{height:100%;background:linear-gradient(90deg,var(--brand),var(--brand2));width:0;transition:width .2s}.testgrid{display:grid;grid-template-columns:minmax(0,1fr) 250px;gap:18px}.question-card{padding:clamp(20px,4vw,34px)}.qmeta{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:.83rem;margin-bottom:22px}.question-card h2{font-size:clamp(1.15rem,2vw,1.5rem);line-height:1.45;margin:0 0 23px}.answers{display:grid;gap:11px}.answer{display:flex;align-items:flex-start;gap:12px;width:100%;padding:15px;border:1px solid var(--line);border-radius:13px;background:#fff;text-align:left;line-height:1.45;color:var(--ink)}.letter{width:28px;height:28px;flex:0 0 28px;border:1px solid #dddfee;border-radius:9px;display:grid;place-items:center;font-size:.82rem;font-weight:850;color:#777b95}.answer:hover{border-color:#aaa4fb;background:#faf9ff}.answer.selected{border-color:var(--brand);background:#f3f2ff}.answer.correct{border-color:#6cc9a0;background:#edfff6}.answer.wrong{border-color:#ef9ba8;background:#fff1f3}.answer.correct .letter{background:#d5f7e6;border-color:#b5e8d0;color:var(--good)}.answer.wrong .letter{background:#ffe0e5;border-color:#ffc4ce;color:var(--bad)}.explanation{margin-top:17px;padding:15px;border-radius:12px;background:#f3f2ff;color:#4f4a92;line-height:1.5}.test-footer{display:flex;justify-content:space-between;gap:10px;margin-top:25px;flex-wrap:wrap}.test-sidebar{padding:20px;height:max-content}.test-sidebar h3{margin:0 0 7px}.test-sidebar p{font-size:.82rem;color:var(--muted);margin:0 0 18px}.qnums{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.qnum{border:1px solid var(--line);background:#fff;border-radius:9px;aspect-ratio:1;font-weight:800;color:#747790}.qnum.current{background:var(--brand);color:white;border-color:var(--brand)}.qnum.answered{border-color:#8f88f3;background:#f0efff;color:#544bc7}.qnum.flagged{box-shadow:inset 0 -3px #efb544}.legend{font-size:.75rem;color:var(--muted);display:grid;gap:8px;margin-top:16px}.legend span:before{content:"";display:inline-block;width:9px;height:9px;border-radius:3px;background:#efb544;margin-right:7px}.legend span:nth-child(2):before{background:#8f88f3}.legend span:nth-child(3):before{background:#dddfee}.result-card{padding:clamp(24px,5vw,45px);text-align:center;max-width:760px;margin:20px auto}.score-ring{width:145px;height:145px;border-radius:50%;border:10px solid #e8e6ff;border-top-color:var(--brand);display:grid;place-items:center;margin:22px auto}.score-ring strong{font-size:2rem;display:block}.score-ring small{color:var(--muted)}.result-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:25px 0}.result-stats div{padding:15px;background:#f8f8fc;border-radius:13px}.result-stats strong{font-size:1.3rem;display:block}.result-stats small{color:var(--muted)}.review-list{display:grid;gap:12px;text-align:left;margin-top:24px}.review-row{border:1px solid var(--line);padding:16px;border-radius:12px}.review-row strong{display:block;margin-bottom:8px}.review-row small{display:block;line-height:1.5;color:var(--muted);margin-top:5px}.review-row .badtext{color:var(--bad)}.review-row .goodtext{color:var(--good)}
.tablewrap{overflow:auto}.table{width:100%;border-collapse:collapse;background:white;border-radius:15px;overflow:hidden}.table th,.table td{text-align:left;padding:14px;border-bottom:1px solid var(--line);font-size:.88rem}.table th{color:var(--muted);font-size:.75rem;text-transform:uppercase;letter-spacing:.07em;background:#fafaff}.table tr:last-child td{border-bottom:0}.smallbtn{padding:7px 10px;border-radius:8px;font-size:.78rem}
@media(max-width:1050px){.subject-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.testgrid{grid-template-columns:minmax(0,1fr) 210px}}
@media(max-width:760px){.layout{grid-template-columns:1fr}aside{border-right:0;border-bottom:1px solid var(--line);padding:10px 14px;display:flex;gap:5px;overflow:auto}.nav-label,.side-note{display:none}.navbtn{width:auto;white-space:nowrap;padding:10px 12px;margin:0;font-size:.83rem}.main{padding:22px 15px}.subject-grid{grid-template-columns:1fr}.testgrid{grid-template-columns:1fr}.test-sidebar{order:-1}.qnums{grid-template-columns:repeat(10,1fr)}.qnum{font-size:.72rem}.test-sidebar p,.legend{display:none}.testtop{align-items:flex-start}.pagehead{align-items:flex-start}.search{min-width:0;width:100%}.searchrow{width:100%}.stats{gap:10px}.stat{padding:15px}.stat-num{font-size:1.5rem}.topbar{height:62px}.layout{min-height:calc(100vh - 62px)}.result-stats{gap:7px}.result-stats div{padding:10px}.result-stats strong{font-size:1.1rem}}
</style>
</head>
<body>
<div class="app">
<header class="topbar">
  <div class="logo">Review<span>RPM</span></div>
  <div class="top-actions"><button class="btn btn-light" id="quickAdd">＋ Add questions</button><div class="avatar">R</div></div>
</header>
<div class="layout">
  <aside>
    <div class="nav-label">Workspace</div>
    <button class="navbtn active" data-view="dashboard"><span class="navicon">⌂</span> Dashboard</button>
    <button class="navbtn" data-view="library"><span class="navicon">▤</span> Practice library</button>
    <button class="navbtn" data-view="progress"><span class="navicon">◔</span> My progress</button>
    <button class="navbtn" data-view="manage"><span class="navicon">⚙</span> Manage questions</button>
    <div class="side-note"><strong>Small steps, big progress.</strong><br>Practice a little every day and build confidence one question at a time.</div>
  </aside>
  <main class="main" id="main"></main>
</div>
<div id="modalRoot"></div>
<div id="toastRoot"></div>
</div>
<script>
const STORE_KEY='reviewrpm_advanced_v1';
const starterSubjects=[
 {id:'hrm',name:'Human Resource Management',emoji:'👥',description:'Recruitment, selection, training, and HR fundamentals.',color:'purple',minutes:15},
 {id:'theories',name:'Psychological Theories',emoji:'🧠',description:'Motivation, behavior, leadership, and workplace theories.',color:'pink',minutes:15},
 {id:'labor',name:'Labor Standards',emoji:'⚖️',description:'Wages, holiday pay, overtime, and workplace rules.',color:'blue',minutes:20},
 {id:'assessment',name:'Psychological Assessment',emoji:'📝',description:'Assessment history, principles, and testing concepts.',color:'orange',minutes:15}
];
const starterQuestions=[
 {id:'q1',subject:'hrm',question:'Which document primarily outlines the duties, responsibilities, and reporting relationships of a position?',choices:['Job specification','Job description','Performance appraisal','Manpower forecast'],answer:1,explanation:'A job description explains the main duties, responsibilities, tasks, and reporting relationships of a position.'},
 {id:'q2',subject:'hrm',question:'Which recruitment source involves filling a vacancy with a current employee?',choices:['External recruitment','Campus recruitment','Internal recruitment','Outsourcing'],answer:2,explanation:'Internal recruitment considers current employees for vacancies, often through promotion or transfer.'},
 {id:'q3',subject:'hrm',question:'What does a selection test primarily help an organization do?',choices:['Guarantee future performance','Measure job-relevant characteristics','Replace every interview','Determine the company budget'],answer:1,explanation:'Selection tests provide structured evidence about candidates’ job-related knowledge, skills, abilities, or other relevant characteristics.'},
 {id:'q4',subject:'hrm',question:'A company receives 120 applicants and hires 12. What is the hiring yield as a percentage of applicants?',choices:['5%','10%','12%','20%'],answer:1,explanation:'Yield ratio = number hired ÷ number of applicants × 100. (12 ÷ 120) × 100 = 10%.'},
 {id:'q5',subject:'theories',question:'According to Herzberg, which is an example of a motivator?',choices:['Company policy','Salary administration','Achievement','Physical working conditions'],answer:2,explanation:'Achievement is a motivator associated with the content of the job. Hygiene factors include policy, pay, supervision, and working conditions.'},
 {id:'q6',subject:'theories',question:'In Maslow’s hierarchy, which needs are generally placed at the base?',choices:['Esteem needs','Self-actualization','Physiological needs','Belongingness needs'],answer:2,explanation:'Physiological needs, such as food, water, and rest, form the base of Maslow’s traditional hierarchy.'},
 {id:'q7',subject:'theories',question:'Which leadership approach adapts the leader’s behavior to the readiness or development of followers?',choices:['Situational leadership','Trait-only leadership','Scientific management','Laissez-faire only'],answer:0,explanation:'Situational leadership proposes adapting leadership behavior to follower needs and development level.'},
 {id:'q8',subject:'labor',question:'In the Philippines, night shift differential under the Labor Code generally applies to work performed between which hours?',choices:['6:00 p.m. and 10:00 p.m.','10:00 p.m. and 6:00 a.m.','12:00 a.m. and 8:00 a.m.','8:00 p.m. and 4:00 a.m.'],answer:1,explanation:'The statutory night shift period is 10:00 p.m. to 6:00 a.m. Eligibility and computation depend on applicable labor rules and employee circumstances.'},
 {id:'q9',subject:'labor',question:'What is overtime work generally called when an employee works beyond the normal eight hours on an ordinary workday?',choices:['Premium leave','Overtime work','Night differential only','Rest-day work'],answer:1,explanation:'Work beyond eight hours on an ordinary workday is generally overtime work and may require additional pay under applicable rules.'},
 {id:'q10',subject:'assessment',question:'Which property refers to the consistency of scores from a psychological test?',choices:['Validity','Reliability','Norming','Utility'],answer:1,explanation:'Reliability concerns the consistency or dependability of test scores across relevant conditions.'},
 {id:'q11',subject:'assessment',question:'Which type of validity concerns how well a test represents the content domain it is intended to measure?',choices:['Content validity','Predictive validity','Face validity only','Concurrent validity'],answer:0,explanation:'Content validity evaluates whether test items adequately represent the relevant domain of content.'},
 {id:'q12',subject:'assessment',question:'A test score is interpreted by comparing it with scores from a relevant reference group. This is called:',choices:['Criterion-free interpretation','Norm-referenced interpretation','Clinical observation','Unstructured evaluation'],answer:1,explanation:'Norm-referenced interpretation compares an individual’s score with a norm group.'}
];
let state=loadState(), currentView='dashboard', activeTest=null, timerInterval=null;
function loadState(){
 try{const s=JSON.parse(localStorage.getItem(STORE_KEY));if(s&&Array.isArray(s.questions)&&Array.isArray(s.subjects))return s;}catch(e){}
 return {subjects:starterSubjects,questions:starterQuestions,attempts:[],settings:{},nextId:100};
}
function saveState(){localStorage.setItem(STORE_KEY,JSON.stringify(state))}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function subject(id){return state.subjects.find(s=>s.id===id)||{name:'Uncategorized',emoji:'📚',id:''}}
function toast(msg){const root=document.getElementById('toastRoot');root.innerHTML=`<div class="toast">${esc(msg)}</div>`;setTimeout(()=>root.innerHTML='',2800)}
function setView(view){currentView=view;document.querySelectorAll('.navbtn').forEach(b=>b.classList.toggle('active',b.dataset.view===view));render()}
document.querySelectorAll('.navbtn').forEach(b=>b.addEventListener('click',()=>setView(b.dataset.view)));
document.getElementById('quickAdd').addEventListener('click',()=>openQuestionModal());
function render(){if(activeTest){renderTest();return}const main=document.getElementById('main');if(currentView==='dashboard')main.innerHTML=dashboardHTML();else if(currentView==='library')main.innerHTML=libraryHTML();else if(currentView==='progress')main.innerHTML=progressHTML();else if(currentView==='manage')main.innerHTML=manageHTML();wireMain()}
function dashboardHTML(){
 const total=state.questions.length,attempts=state.attempts.length,avg=attempts?Math.round(state.attempts.reduce((a,x)=>a+x.percent,0)/attempts):0,best=attempts?Math.max(...state.attempts.map(x=>x.percent)):0;
 return `<div class="pagehead"><div><div class="eyebrow">Your learning space</div><h1>Welcome back, learner 👋</h1><p class="sub">Make today count. Pick a subject and keep your momentum going.</p></div><button class="btn btn-primary" id="startRandom">▶ Quick practice</button></div>
 <div class="stats">
  <div class="stat"><div class="stat-top">Question bank <span class="stat-icon">📚</span></div><div class="stat-num">${total}</div><div class="stat-foot">Questions available</div></div>
  <div class="stat"><div class="stat-top">Tests completed <span class="stat-icon">✅</span></div><div class="stat-num">${attempts}</div><div class="stat-foot">Saved on this device</div></div>
  <div class="stat"><div class="stat-top">Average score <span class="stat-icon">📈</span></div><div class="stat-num">${avg}%</div><div class="stat-foot">Across completed tests</div></div>
  <div class="stat"><div class="stat-top">Personal best <span class="stat-icon">🏆</span></div><div class="stat-num">${best}%</div><div class="stat-foot">Your highest result</div></div>
 </div>
 <div class="section-head"><h2>Explore subjects</h2><button class="btn btn-light" id="viewAll">View all →</button></div>
 <div class="subject-grid">${state.subjects.slice(0,6).map(s=>subjectCard(s)).join('')||'<div class="empty">Add a subject to get started.</div>'}</div>
 <div class="section-head"><h2>Recent activity</h2><button class="btn btn-outline" id="progressLink">See progress</button></div>
 <div class="recent-list">${state.attempts.slice(-4).reverse().map(a=>`<div class="card recent-item"><div class="recent-left"><div class="recent-icon">📝</div><div><strong>${esc(a.title)}</strong><small>${new Date(a.date).toLocaleString()} · ${a.total} questions</small></div></div><span class="pill">${a.percent}%</span></div>`).join('')||'<div class="card empty">No completed tests yet. Your activity will appear here.</div>'}</div>`;
}
function subjectCard(s){const count=state.questions.filter(q=>q.subject===s.id).length;return `<article class="card subject-card" data-subject="${esc(s.id)}"><div class="subject-emoji">${esc(s.emoji||'📚')}</div><h3>${esc(s.name)}</h3><p>${esc(s.description||'Custom practice questions')}</p><div class="subject-meta"><span>${count} questions</span><span class="pill">Practice →</span></div></article>`}
function libraryHTML(){return `<div class="pagehead"><div><div class="eyebrow">Practice library</div><h1>Choose your next challenge</h1><p class="sub">Pick a subject, then choose practice mode or exam mode.</p></div><button class="btn btn-primary" id="addSubject">＋ Add subject</button></div><div class="section-head"><h2>All subjects</h2><div class="searchrow"><input class="search" id="subjectSearch" placeholder="Search subjects..."></div></div><div class="subject-grid" id="libraryGrid">${state.subjects.map(s=>subjectCard(s)).join('')||'<div class="empty">No subjects yet. Add one to begin.</div>'}</div>`}
function progressHTML(){const attempts=[...state.attempts].reverse();const avg=attempts.length?Math.round(attempts.reduce((a,x)=>a+x.percent,0)/attempts.length):0;return `<div class="pagehead"><div><div class="eyebrow">Performance overview</div><h1>My progress</h1><p class="sub">Review your results and learn from every attempt.</p></div><button class="btn btn-outline" id="exportProgress">Export results CSV</button></div><div class="stats"><div class="stat"><div class="stat-top">Completed tests <span class="stat-icon">✅</span></div><div class="stat-num">${attempts.length}</div></div><div class="stat"><div class="stat-top">Average score <span class="stat-icon">📈</span></div><div class="stat-num">${avg}%</div></div><div class="stat"><div class="stat-top">Highest score <span class="stat-icon">🏆</span></div><div class="stat-num">${attempts.length?Math.max(...attempts.map(a=>a.percent)):0}%</div></div><div class="stat"><div class="stat-top">Questions in bank <span class="stat-icon">📚</span></div><div class="stat-num">${state.questions.length}</div></div></div><div class="section-head"><h2>Test history</h2></div><div class="card tablewrap"><table class="table"><thead><tr><th>Test</th><th>Date</th><th>Score</th><th>Result</th><th></th></tr></thead><tbody>${attempts.map(a=>`<tr><td><strong>${esc(a.title)}</strong></td><td>${new Date(a.date).toLocaleDateString()}</td><td>${a.score}/${a.total}</td><td><span class="pill">${a.percent}%</span></td><td><button class="btn btn-outline smallbtn" data-review-attempt="${esc(a.id)}">Review</button></td></tr>`).join('')||'<tr><td colspan="5" class="empty">Complete a test to see your history.</td></tr>'}</tbody></table></div>`}
function manageHTML(){return `<div class="pagehead"><div><div class="eyebrow">Question manager</div><h1>Build your question bank</h1><p class="sub">Add, edit, export, or import your own multiple-choice questions.</p></div><button class="btn btn-primary" id="newQuestion">＋ New question</button></div><div class="searchrow" style="margin-bottom:16px"><input class="search" id="questionSearch" placeholder="Search questions..."><select class="search" id="filterSubject"><option value="">All subjects</option>${state.subjects.map(s=>`<option value="${esc(s.id)}">${esc(s.name)}</option>`).join('')}</select><button class="btn btn-outline" id="exportQuestions">Export JSON</button><button class="btn btn-outline" id="importQuestions">Import JSON</button><input type="file" id="importFile" accept=".json,application/json" class="hidden"></div><div class="card tablewrap"><table class="table"><thead><tr><th>Question</th><th>Subject</th><th>Correct answer</th><th>Actions</th></tr></thead><tbody id="questionRows">${questionRows(state.questions)}</tbody></table></div><p class="sub" style="margin-top:12px;font-size:.82rem">Your question bank is stored in this browser. Export a backup regularly, especially before clearing browser data.</p>`}
function questionRows(qs){return qs.map(q=>`<tr><td style="min-width:250px">${esc(q.question)}</td><td>${esc(subject(q.subject).name)}</td><td>${esc(q.choices[q.answer]||'')}</td><td style="white-space:nowrap"><button class="btn btn-outline smallbtn" data-edit="${esc(q.id)}">Edit</button> <button class="btn btn-danger smallbtn" data-delete="${esc(q.id)}">Delete</button></td></tr>`).join('')||'<tr><td colspan="4" class="empty">No questions match your search.</td></tr>'}
function wireMain(){
 document.querySelectorAll('[data-subject]').forEach(el=>el.addEventListener('click',()=>openSubject(el.dataset.subject)));
 const viewAll=document.getElementById('viewAll');if(viewAll)viewAll.onclick=()=>setView('library');
 const pl=document.getElementById('progressLink');if(pl)pl.onclick=()=>setView('progress');
 const sr=document.getElementById('subjectSearch');if(sr)sr.oninput=()=>{const v=sr.value.toLowerCase();document.getElementById('libraryGrid').innerHTML=state.subjects.filter(s=>(s.name+' '+s.description).toLowerCase().includes(v)).map(subjectCard).join('')||'<div class="empty">No subjects found.</div>';document.querySelectorAll('[data-subject]').forEach(el=>el.onclick=()=>openSubject(el.dataset.subject))};
 const as=document.getElementById('addSubject');if(as)as.onclick=openSubjectModal;
 const sq=document.getElementById('startRandom');if(sq)sq.onclick=()=>startTest({title:'Quick practice',questions:shuffle([...state.questions]).slice(0,Math.min(10,state.questions.length)),mode:'practice',minutes:0});
 const nq=document.getElementById('newQuestion');if(nq)nq.onclick=()=>openQuestionModal();
 const qs=document.getElementById('questionSearch'),fs=document.getElementById('filterSubject');function filterRows(){const term=(qs?.value||'').toLowerCase(),sub=fs?.value||'';document.getElementById('questionRows').innerHTML=questionRows(state.questions.filter(q=>(!sub||q.subject===sub)&&(q.question+' '+q.choices.join(' ')).toLowerCase().includes(term)));wireQuestionActions()}if(qs)qs.oninput=filterRows;if(fs)fs.onchange=filterRows;
 const ex=document.getElementById('exportQuestions');if(ex)ex.onclick=()=>download('reviewrpm-question-bank.json',JSON.stringify({subjects:state.subjects,questions:state.questions},null,2),'application/json');
 const im=document.getElementById('importQuestions');if(im)im.onclick=()=>document.getElementById('importFile').click();
 const fi=document.getElementById('importFile');if(fi)fi.onchange=importQuestionFile;
 const ep=document.getElementById('exportProgress');if(ep)ep.onclick=exportCSV;
 document.querySelectorAll('[data-review-attempt]').forEach(b=>b.onclick=()=>reviewAttempt(b.dataset.reviewAttempt));
 wireQuestionActions();
}
function wireQuestionActions(){document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>openQuestionModal(b.dataset.edit));document.querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>{const q=state.questions.find(q=>q.id===b.dataset.delete);if(q&&confirm('Delete this question?')){state.questions=state.questions.filter(x=>x.id!==q.id);saveState();render();toast('Question deleted')}})}
function openModal(content){document.getElementById('modalRoot').innerHTML=`<div class="modalback" id="modalback"><section class="modal">${content}</section></div>`;document.getElementById('modalback').addEventListener('click',e=>{if(e.target.id==='modalback')closeModal()})}
function closeModal(){document.getElementById('modalRoot').innerHTML=''}
function openSubjectModal(){openModal(`<h2>Add a subject</h2><p>Create a category for organizing your practice questions.</p><form id="subjectForm" class="formgrid"><label class="field">Subject name<input name="name" required maxlength="70" placeholder="e.g. CHRA Set A"></label><label class="field">Icon / emoji<input name="emoji" maxlength="4" value="📚"></label><label class="field">Description<input name="description" maxlength="140" placeholder="What will this subject cover?"></label><div class="modal-actions"><button type="button" class="btn btn-outline" onclick="closeModal()">Cancel</button><button class="btn btn-primary">Create subject</button></div></form>`);document.getElementById('subjectForm').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target),name=f.get('name').trim();if(!name)return;state.subjects.push({id:'s'+Date.now(),name,emoji:f.get('emoji')||'📚',description:f.get('description')||'Custom practice questions',minutes:15});saveState();closeModal();render();toast('Subject created')}}
function openQuestionModal(id){const q=id?state.questions.find(x=>x.id===id):null;const choices=q?[...q.choices]:['','','',''];while(choices.length<4)choices.push('');openModal(`<h2>${q?'Edit question':'Add a question'}</h2><p>Write a clear question, four answer choices, and an explanation.</p><form id="questionForm" class="formgrid"><label class="field">Subject<select name="subject" required>${state.subjects.map(s=>`<option value="${esc(s.id)}" ${q?.subject===s.id?'selected':''}>${esc(s.name)}</option>`).join('')}</select></label><label class="field">Question<textarea name="question" required maxlength="1000" placeholder="Enter your question...">${esc(q?.question||'')}</textarea></label>${choices.map((c,i)=>`<label class="field">Choice ${String.fromCharCode(65+i)}<input name="choice${i}" required maxlength="350" value="${esc(c)}" placeholder="Answer choice ${String.fromCharCode(65+i)}"></label>`).join('')}<label class="field">Correct answer<select name="answer">${choices.map((c,i)=>`<option value="${i}" ${q?.answer===i?'selected':''}>${String.fromCharCode(65+i)}${c?' · '+esc(c.slice(0,45)):''}</option>`).join('')}</select></label><label class="field">Explanation<textarea name="explanation" maxlength="1200" placeholder="Explain why the answer is correct...">${esc(q?.explanation||'')}</textarea></label><div class="modal-actions"><button type="button" class="btn btn-outline" onclick="closeModal()">Cancel</button><button class="btn btn-primary">${q?'Save changes':'Add question'}</button></div></form>`);document.getElementById('questionForm').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target);const item={id:q?q.id:'q'+(state.nextId++),subject:f.get('subject'),question:f.get('question').trim(),choices:[0,1,2,3].map(i=>f.get('choice'+i).trim()),answer:Number(f.get('answer')),explanation:f.get('explanation').trim()};if(q)state.questions=state.questions.map(x=>x.id===q.id?item:x);else state.questions.push(item);saveState();closeModal();render();toast(q?'Question updated':'Question added')}}
function openSubject(id){const s=subject(id),qs=state.questions.filter(q=>q.subject===id);if(!qs.length){openModal(`<h2>${esc(s.name)}</h2><p>There are no questions in this subject yet. Add questions to start practicing.</p><div class="modal-actions"><button class="btn btn-outline" onclick="closeModal()">Close</button><button class="btn btn-primary" id="addForSubject">＋ Add question</button></div>`);document.getElementById('addForSubject').onclick=()=>{closeModal();openQuestionModal()};return}openModal(`<h2>${esc(s.emoji)} ${esc(s.name)}</h2><p>${qs.length} questions available. Choose a mode to begin.</p><div class="formgrid"><label class="field">Number of questions<select id="testCount"><option value="5">5 questions</option><option value="10" selected>10 questions</option><option value="20">20 questions</option><option value="all">All questions (${qs.length})</option></select></label><label class="field">Mode<select id="testMode"><option value="practice">Practice mode · instant feedback</option><option value="exam">Exam mode · results at the end</option></select></label><label class="field">Time limit<select id="testMinutes"><option value="0">No timer</option><option value="10">10 minutes</option><option value="15" selected>15 minutes</option><option value="30">30 minutes</option><option value="60">60 minutes</option></select></label><label style="display:flex;align-items:center;gap:9px;font-size:.9rem"><input type="checkbox" id="shuffleCheck" checked> Shuffle questions and choices</label></div><div class="modal-actions"><button class="btn btn-outline" onclick="closeModal()">Cancel</button><button class="btn btn-primary" id="beginTest">Start test →</button></div>`);document.getElementById('beginTest').onclick=()=>{const count=document.getElementById('testCount').value,mode=document.getElementById('testMode').value,minutes=Number(document.getElementById('testMinutes').value),sh=document.getElementById('shuffleCheck').checked;let list=qs.map(q=>({...q,choices:[...q.choices],answer:q.answer}));if(sh)list=shuffle(list).map(q=>{const correct=q.choices[q.answer],opts=shuffle(q.choices);return {...q,choices:opts,answer:opts.indexOf(correct)}});if(count!=='all')list=list.slice(0,Math.min(Number(count),list.length));closeModal();startTest({title:s.name,questions:list,mode,minutes})}}
function shuffle(arr){for(let i=arr.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]]}return arr}
function startTest(config){if(!config.questions.length){toast('Add questions before starting a test.');return}activeTest={...config,index:0,answers:{},flags:[],startedAt:Date.now(),remaining:config.minutes*60};currentView='test';document.querySelectorAll('.navbtn').forEach(b=>b.classList.remove('active'));if(config.minutes>0)timerInterval=setInterval(tickTimer,1000);renderTest()}
function tickTimer(){if(!activeTest)return;activeTest.remaining--;const el=document.getElementById('timer');if(el){el.textContent=formatTime(activeTest.remaining);el.classList.toggle('warning',activeTest.remaining<=60)}if(activeTest.remaining<=0){clearInterval(timerInterval);finishTest(true)}}
function formatTime(s){s=Math.max(0,s);return `${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`}
function renderTest(){const t=activeTest;if(!t)return;const q=t.questions[t.index],answered=t.answers[q.id]!==undefined,correct=answered&&t.answers[q.id]===q.answer;const main=document.getElementById('main');main.innerHTML=`<div class="test-shell"><div class="testtop"><div><div class="eyebrow">${t.mode==='practice'?'Practice mode':'Exam mode'}</div><h1>${esc(t.title)}</h1><p class="sub" style="font-size:.86rem">${Object.keys(t.answers).length} of ${t.questions.length} answered</p></div><div style="display:flex;gap:9px;align-items:center">${t.minutes?`<div class="timer ${t.remaining<=60?'warning':''}" id="timer">${formatTime(t.remaining)}</div>`:''}<button class="btn btn-outline" id="exitTest">Exit</button></div></div><div class="testprogress"><div style="width:${(Object.keys(t.answers).length/t.questions.length)*100}%"></div></div><div class="testgrid"><section class="card question-card"><div class="qmeta"><span>QUESTION ${t.index+1} OF ${t.questions.length}</span><button class="btn ${t.flags.includes(q.id)?'btn-light':'btn-outline'} smallbtn" id="flagQuestion">${t.flags.includes(q.id)?'🚩 Flagged':'⚑ Flag for review'}</button></div><h2>${esc(q.question)}</h2><div class="answers">${q.choices.map((c,i)=>`<button class="answer ${answered&&i===q.answer?'correct':''} ${answered&&t.answers[q.id]===i&&i!==q.answer?'wrong':''} ${!answered&&t.answers[q.id]===i?'selected':''}" data-answer="${i}" ${answered&&t.mode==='practice'?'disabled':''}><span class="letter">${String.fromCharCode(65+i)}</span><span>${esc(c)}</span></button>`).join('')}</div>${answered&&t.mode==='practice'?`<div class="explanation"><strong>${correct?'✓ Correct!':'✕ Not quite.'}</strong> ${esc(q.explanation||'No explanation has been added for this question.')}</div>`:''}<div class="test-footer"><button class="btn btn-outline" id="prevQuestion" ${t.index===0?'disabled':''}>← Previous</button><div style="display:flex;gap:9px"><button class="btn btn-outline" id="clearAnswer" ${t.answers[q.id]===undefined?'disabled':''}>Clear answer</button>${t.index===t.questions.length-1?'<button class="btn btn-primary" id="finishTest">Finish test ✓</button>':'<button class="btn btn-primary" id="nextQuestion">Next question →</button>'}</div></div></section><aside class="card test-sidebar"><h3>Question navigator</h3><p>Select a number to jump to a question.</p><div class="qnums">${t.questions.map((x,i)=>`<button class="qnum ${i===t.index?'current':''} ${t.answers[x.id]!==undefined?'answered':''} ${t.flags.includes(x.id)?'flagged':''}" data-jump="${i}">${i+1}</button>`).join('')}</div><div class="legend"><span>Flagged for review</span><span>Answered</span><span>Not answered</span></div><button class="btn btn-primary" id="finishTestSide" style="width:100%;margin-top:20px">Finish test</button></aside></div></div>`;
 document.querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>{if(t.mode==='practice'&&t.answers[q.id]!==undefined)return;t.answers[q.id]=Number(b.dataset.answer);renderTest()});
 document.querySelectorAll('[data-jump]').forEach(b=>b.onclick=()=>{t.index=Number(b.dataset.jump);renderTest()});
 document.getElementById('flagQuestion').onclick=()=>{t.flags=t.flags.includes(q.id)?t.flags.filter(x=>x!==q.id):[...t.flags,q.id];renderTest()};
 document.getElementById('prevQuestion').onclick=()=>{t.index--;renderTest()};
 const next=document.getElementById('nextQuestion');if(next)next.onclick=()=>{t.index++;renderTest()};
 document.getElementById('clearAnswer').onclick=()=>{delete t.answers[q.id];renderTest()};
 document.getElementById('finishTest').onclick=()=>confirmFinish();document.getElementById('finishTestSide').onclick=()=>confirmFinish();
 document.getElementById('exitTest').onclick=()=>{if(confirm('Exit this test? Your current attempt will not be saved.')){clearInterval(timerInterval);activeTest=null;setView('dashboard')}};
}
function confirmFinish(){const t=activeTest,unanswered=t.questions.length-Object.keys(t.answers).length;if(unanswered&& !confirm(`You have ${unanswered} unanswered question(s). Submit anyway?`))return;finishTest(false)}
function finishTest(auto){clearInterval(timerInterval);const t=activeTest;if(!t)return;let score=0;const details=t.questions.map(q=>{const picked=t.answers[q.id];const correct=picked===q.answer;if(correct)score++;return {question:q.question,choices:q.choices,answer:q.answer,picked,correct,explanation:q.explanation}});const attempt={id:'a'+Date.now(),title:t.title,date:new Date().toISOString(),score,total:t.questions.length,percent:Math.round(score/t.questions.length*100),mode:t.mode,details};state.attempts.push(attempt);saveState();activeTest=null;currentView='result';renderResult(attempt,auto)}
function renderResult(a,auto){document.querySelectorAll('.navbtn').forEach(b=>b.classList.remove('active'));const pct=a.percent,headline=pct>=85?'Excellent work!':pct>=70?'Good progress!':pct>=50?'Keep practicing!':'Every attempt is a learning opportunity.';document.getElementById('main').innerHTML=`<div class="card result-card"><div class="eyebrow">Test ${auto?'auto-submitted':'completed'}</div><h1 style="font-size:2rem;margin:9px 0">${headline}</h1><p class="sub">${esc(a.title)} · ${new Date(a.date).toLocaleString()}</p><div class="score-ring"><div><strong>${pct}%</strong><small>score</small></div></div><div class="result-stats"><div><strong>${a.score}/${a.total}</strong><small>Correct</small></div><div><strong>${a.total-a.score}</strong><small>Incorrect / blank</small></div><div><strong>${a.total?Math.round(a.score/a.total*100):0}%</strong><small>Accuracy</small></div></div><div style="display:flex;justify-content:center;gap:10px;flex-wrap:wrap"><button class="btn btn-primary" id="reviewMistakes">Review answers</button><button class="btn btn-outline" id="retryTest">Try again</button><button class="btn btn-outline" id="backDashboard">Dashboard</button></div><div id="resultReview"></div></div>`;
 document.getElementById('reviewMistakes').onclick=()=>showAttemptReview(a,'resultReview');document.getElementById('retryTest').onclick=()=>{const qs=a.details.map((d,i)=>{const original=state.questions.find(q=>q.question===d.question);return original?{...original,choices:[...original.choices]}:null}).filter(Boolean);if(qs.length)startTest({title:a.title,questions:qs,mode:a.mode,minutes:0});else toast('These questions may have been removed from the bank.')};document.getElementById('backDashboard').onclick=()=>setView('dashboard')}
function reviewAttempt(id){const a=state.attempts.find(x=>x.id===id);if(!a)return;openModal(`<h2>${esc(a.title)} · ${a.percent}%</h2><p>${new Date(a.date).toLocaleString()} · ${a.score}/${a.total} correct</p><div class="review-list">${a.details.map((d,i)=>`<div class="review-row"><strong>${i+1}. ${esc(d.question)}</strong><small class="${d.correct?'goodtext':'badtext'}">Your answer: ${d.picked===undefined?'Not answered':esc(d.choices[d.picked])}</small><small class="goodtext">Correct answer: ${esc(d.choices[d.answer])}</small><small>${esc(d.explanation||'No explanation provided.')}</small></div>`).join('')}</div><div class="modal-actions" style="margin-top:20px"><button class="btn btn-primary" onclick="closeModal()">Close</button></div>`)}
function showAttemptReview(a,targetId){const el=document.getElementById(targetId);if(!el)return;el.innerHTML=`<div class="review-list">${a.details.map((d,i)=>`<div class="review-row"><strong>${i+1}. ${esc(d.question)}</strong><small class="${d.correct?'goodtext':'badtext'}">Your answer: ${d.picked===undefined?'Not answered':esc(d.choices[d.picked])}</small><small class="goodtext">Correct answer: ${esc(d.choices[d.answer])}</small><small>${esc(d.explanation||'No explanation provided.')}</small></div>`).join('')}</div>`}
function download(filename,content,type){const blob=new Blob([content],{type}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(url);toast('Download started')}
function importQuestionFile(e){const file=e.target.files[0];if(!file)return;const reader=new FileReader();reader.onload=()=>{try{const data=JSON.parse(reader.result);if(!Array.isArray(data.questions))throw new Error('JSON must include a questions array.');if(data.subjects&&Array.isArray(data.subjects)){const ids=new Set(state.subjects.map(s=>s.id));data.subjects.forEach(s=>{if(s.id&&!ids.has(s.id)){state.subjects.push(s);ids.add(s.id)}})}let added=0;data.questions.forEach(q=>{if(q.question&&Array.isArray(q.choices)&&q.choices.length>=2&&Number.isInteger(Number(q.answer))&&q.answer>=0&&q.answer<q.choices.length){state.questions.push({...q,id:'q'+(state.nextId++)});added++}});saveState();render();toast(`Imported ${added} question(s)`)}catch(err){alert('Could not import file: '+err.message)}e.target.value=''};reader.readAsText(file)}
function exportCSV(){const rows=[['Test','Date','Score','Total','Percent','Mode'],...state.attempts.map(a=>[a.title,a.date,a.score,a.total,a.percent,a.mode])];const csv=rows.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\r\n');download('reviewrpm-progress.csv',csv,'text/csv;charset=utf-8')}
render();
</script>
</body>
</html>
